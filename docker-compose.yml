version: '3.8'

services:
  linuxguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linuxguard-agent
    restart: unless-stopped
    ports:
      - "9876:9876"
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    volumes:
      - /etc:/host/etc:ro
      - /usr/local/bin:/host/usr/local/bin:ro
      - /opt:/host/opt:ro
      - ./testdata:/app/testdata
      - ./configs/linuxguard.example.yaml:/etc/linuxguard/config.yaml:ro
    environment:
      - TZ=UTC
