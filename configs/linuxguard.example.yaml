server:
  host: "0.0.0.0"
  port: 9876

database:
  path: "./linuxguard.db"

monitoring:
  paths:
    - "./testdata"
  excluded_paths:
    - "/proc"
    - "/sys"
    - "/dev"
    - "/run"

process_monitor:
  enabled: true
  interval_seconds: 3

quarantine:
  enabled: true
  path: "./quarantine"

detection:
  enabled: true
  suspicious_extensions:
    - ".sh"
    - ".bin"
    - ".elf"
    - ".py"
    - ".pl"
    - ".so"
